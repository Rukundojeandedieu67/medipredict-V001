[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "medipredict-blood-network"
version = "0.1.0"
description = "Rwanda blood-network early-warning and rebalancing prototype"
requires-python = ">=3.11"
dependencies = [
    "alembic>=1.13",
    "geoalchemy2>=0.15",
    "joblib>=1.3",
    "lightgbm>=4.0",
    "numpy>=1.26",
    "openpyxl>=3.1",
    "pandas>=2.1",
    "pdfplumber>=0.11",
    "pyarrow>=17.0",
    "python-docx>=1.1",
    "xlrd>=2.0",
    "psycopg[binary]>=3.1",
    "PyYAML>=6.0",
    "scikit-learn>=1.4",
    "SQLAlchemy>=2.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
medipredict-sim = "medipredict.simulator:main"
medipredict-load-reference = "medipredict.db.load_reference:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
medipredict = ["sim/config/*.yaml", "db/migrations/*.mako"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
